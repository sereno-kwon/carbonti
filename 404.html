<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CARBON-TI KOREA</title>
<meta name="robots" content="noindex">
<script>
  // 하위 주소(/chainring, /x-lock ...)를 원페이지 섹션으로 연결
  // github.io 미리보기(/carbonti/)와 자체 도메인(/) 모두 동작
  var base = location.hostname.slice(-10) === 'github.io' ? '/carbonti/' : '/';
  var key = location.pathname.slice(base.length).replace(/\/$/, '').toLowerCase();
  var alias = { 'x-carboring':'chainring', 'carboring':'chainring', 'chainrings':'chainring', 'x-rotor':'rotor', 'rotors':'rotor', 'disc-rotor':'rotor',
                'x-lock':'frame', 'x-lock-evo':'frame', 'thru-axle':'frame', 'x-cap':'frame', 'x-hanger':'parts', 'udh':'parts', 'service-parts':'parts',
                'color':'colour', 'colors':'colour', 'about':'brand', 'contact':'showroom', 'dealer':'dealers', 'lineup':'range' };
  var map = { brand:1, range:1, chainring:1, rotor:1, frame:1, parts:1, colour:1, showroom:1, dealers:1 };
  key = alias[key] || key;
  location.replace(base + (map[key] ? '#' + key : ''));
</script>
<style>body{background:#fff}@media (prefers-color-scheme:dark){body{background:#101114}}</style>
</head>
<body></body>
</html>
